# pmacctd template for magent netflow intake.
# Custom output plugin must POST JSON to magent http_server endpoint.

daemonize: false
debug: false

# Capture interface(s)
pcap_interface: eth0
pcap_direction: inout

# 5-tuple + iface dimensions
aggregate[print]: in_iface,proto,src_host,src_port,dst_host,dst_port

plugins: print
print_output: custom
print_output_custom_lib: /opt/pmacct/libpmacct_magent_custom.so
print_output_custom_cfg_file: /etc/pmacct/magent_custom.conf

# Window (seconds)
print_refresh_time: 60
print_history: 1m
